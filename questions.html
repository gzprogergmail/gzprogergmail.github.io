<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brain Quest</title>

<style>
:root{
  --bg:#fff5fb;
  --card:#ffffff;
  --accent:#ff8fcf;
  --accent2:#8adfff;
  --yes:#7cffc2;
  --no:#ff9bb5;
  --text:#333;
  --muted:#777;
}

*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:"Comic Neue","Segoe UI",system-ui,sans-serif;
  background:linear-gradient(180deg,#ffe9f4,#e9f6ff);
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
}

.header{
  text-align:center;
  padding:12px 0;
}
.header h1{
  margin:0;
  font-size:22px;
}
.header p{
  margin:4px 0 0;
  font-size:13px;
  color:var(--muted);
}

.progress{
  margin-top:6px;
}
.progress-top{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:var(--muted);
}
.bar{
  height:10px;
  background:#eee;
  border-radius:999px;
  overflow:hidden;
  margin-top:6px;
}
.bar>div{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  transition:.25s;
}

.main{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px 0;
}

.card{
  background:var(--card);
  border-radius:28px;
  padding:24px;
  box-shadow:0 15px 40px rgba(0,0,0,.12);
  width:100%;
  text-align:center;
}

.question{
  font-size:20px;
  line-height:1.4;
}

.footer{
  position:sticky;
  bottom:0;
  padding:12px 0 env(safe-area-inset-bottom);
  background:linear-gradient(180deg,transparent,rgba(255,255,255,.9) 40%);
}

.buttons{
  display:flex;
  gap:14px;
}
button{
  flex:1;
  border:none;
  border-radius:999px;
  padding:16px 0;
  font-size:20px;
  font-weight:700;
  cursor:pointer;
  transition:.15s;
}
button:active{transform:scale(.95)}
.yes{background:var(--yes)}
.no{background:var(--no)}

.toast{
  position:fixed;
  bottom:90px;
  left:50%;
  transform:translateX(-50%);
  background:white;
  padding:10px 18px;
  border-radius:999px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  opacity:0;
  transition:.2s;
}
.toast.show{opacity:1}

.result{
  text-align:center;
}
.result h2{
  font-size:32px;
  margin:12px 0;
}
.result p{
  font-size:16px;
  line-height:1.5;
}
</style>
</head>

<body>
<div class="app">
  <div class="header">
    <h1>🧠 Brain Quest</h1>
    <p>Clear 5 stages · Answer Yes / No only</p>
  </div>

  <div class="progress">
    <div class="progress-top">
      <div id="stage">Stage 1 / 5</div>
      <div id="count">1 / 10</div>
    </div>
    <div class="bar"><div id="bar"></div></div>
  </div>

  <div class="main">
    <div class="card" id="card">
      <div class="question" id="question"></div>
    </div>
  </div>

  <div class="footer">
    <div class="buttons">
      <button class="yes" onclick="answer(true)">YES 👍</button>
      <button class="no" onclick="answer(false)">NO 👎</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== questions injected ===== */
const QUESTIONS = [
  ...ASSESSMENT.questions
];

/* ===== state ===== */
const TOTAL = 50;
const PER_STAGE = 10;
let order = shuffle([...Array(TOTAL).keys()]);
let index = 0;
let yesCount = 0;

/* ===== elements ===== */
const qEl = document.getElementById("question");
const stageEl = document.getElementById("stage");
const countEl = document.getElementById("count");
const barEl = document.getElementById("bar");
const toastEl = document.getElementById("toast");
const cardEl = document.getElementById("card");

/* ===== audio (mobile safe) ===== */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
const audio = new AudioCtx();
audio.resume();

function beep(freq){
  const o = audio.createOscillator();
  const g = audio.createGain();
  o.connect(g); g.connect(audio.destination);
  o.frequency.value = freq;
  g.gain.value = 0.15;
  o.start();
  o.stop(audio.currentTime+0.12);
}

/* ===== helpers ===== */
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function toast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add("show");
  setTimeout(()=>toastEl.classList.remove("show"),1000);
}

/* ===== render ===== */
function render(){
  const stage = Math.floor(index / PER_STAGE) + 1;
  const inStage = (index % PER_STAGE) + 1;

  stageEl.textContent = `Stage ${stage} / 5`;
  countEl.textContent = `${inStage} / 10`;
  barEl.style.width = `${(inStage-1)/10*100}%`;

  qEl.textContent = QUESTIONS[order[index]].text;
}

function answer(v){
  beep(v?600:300);
  if(v) yesCount++;
  index++;

  if(index % PER_STAGE === 0){
    toast("✨ Stage Clear!");
  }

  if(index >= TOTAL){
    showResult();
  }else{
    render();
  }
}

function showResult(){
  cardEl.innerHTML = `
    <div class="result">
      <h2>${yesCount} / 50</h2>
      <p>${interpret()}</p>
      <button onclick="location.reload()">Play Again</button>
    </div>`;
}

/* ===== scoring ===== */
function interpret(){
  if(yesCount<=10) return "Unlikely ADHD pattern.";
  if(yesCount<=20) return "Possible mild executive difficulty.";
  return "High probability pattern. Professional evaluation advised.";
}

/* ===== start ===== */
render();
</script>

<!-- ===== assessment data ===== -->
<script>
const ASSESSMENT = /* 你原始 JSON，保持不变 */;
</script>
</body>
</html>
