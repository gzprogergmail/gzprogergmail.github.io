<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Brain Quest</title>

<style>
:root{
  --bg1:#ffe6f3;
  --bg2:#e7f7ff;
  --card:#ffffffee;
  --text:#2b2b2b;
  --muted:#7a7a7a;
  --pink:#ff7fc8;
  --blue:#7ad7ff;
  --mint:#7dffca;
  --rose:#ff9bb8;
  --shadow: 0 18px 50px rgba(0,0,0,.12);
  --r: 26px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family: ui-rounded, "Comic Neue", system-ui, -apple-system, Segoe UI, Roboto, Arial;
  color:var(--text);
  background: linear-gradient(180deg, var(--bg1), var(--bg2));
  overflow-x:hidden;
}

.app{
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  display:flex;
  flex-direction:column;
  gap:12px;
}

.top{
  text-align:center;
  padding-top:10px;
}
.title{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  font-weight:900;
  letter-spacing:.2px;
  font-size:24px;
  margin:0;
}
.subtitle{
  margin:6px 0 0;
  color:var(--muted);
  font-size:13px;
}

.hud{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 12px;
  border-radius:999px;
  background: rgba(255,255,255,.65);
  box-shadow: 0 10px 26px rgba(0,0,0,.06);
  backdrop-filter: blur(8px);
}
.hud .left, .hud .right{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  color:var(--muted); font-size:12px;
}
.chip{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 10px;
  border-radius:999px;
  background:#fff;
  border:1px solid rgba(0,0,0,.06);
  white-space:nowrap;
}
.miniBtn{
  border:none;
  background:#fff;
  border:1px solid rgba(0,0,0,.06);
  border-radius:999px;
  padding:8px 10px;
  font-weight:800;
  cursor:pointer;
}
.miniBtn:active{transform:scale(.98)}
.bar{
  height:10px;
  background: rgba(0,0,0,.06);
  border-radius:999px;
  overflow:hidden;
  flex:1;
  min-width:110px;
}
.bar > div{
  height:100%;
  width:0%;
  background: linear-gradient(90deg, var(--pink), var(--blue));
  transition: width .25s ease;
}

.main{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding: 8px 0 0;
}

.card{
  width:100%;
  background: var(--card);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  padding: 22px 18px;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.sticker{
  position:absolute;
  right:14px; top:14px;
  font-size:12px;
  font-weight:900;
  padding:8px 10px;
  border-radius:999px;
  background: linear-gradient(90deg, rgba(255,127,200,.18), rgba(122,215,255,.18));
  border:1px solid rgba(0,0,0,.06);
}

.q{
  font-size:20px;
  line-height:1.45;
  font-weight:850;
  margin: 10px 0 0;
}
.hint{
  margin: 14px 0 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.4;
}

.bottom{
  position: sticky;
  bottom: 0;
  padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
  background: linear-gradient(180deg, transparent, rgba(255,255,255,.95) 38%);
}
.btnRow{display:flex;gap:12px}
.btn{
  flex:1;
  border:none;
  border-radius: 999px;
  padding: 16px 0;
  font-size:20px;
  font-weight:950;
  cursor:pointer;
  box-shadow: 0 14px 30px rgba(0,0,0,.10);
  letter-spacing:.2px;
}
.btn:active{transform:scale(.98)}
.yes{background: linear-gradient(180deg, rgba(125,255,202,1), rgba(85,235,175,1));}
.no{background: linear-gradient(180deg, rgba(255,155,184,1), rgba(255,125,155,1));}
.btn span{filter: drop-shadow(0 6px 10px rgba(0,0,0,.12));}

.overlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background: rgba(0,0,0,.25);
  backdrop-filter: blur(10px);
  z-index:999;
}
.overlay.show{display:flex;}
.modal{
  width:min(520px, 100%);
  background:#fff;
  border-radius: 28px;
  padding: 18px 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,.22);
  text-align:center;
}
.modal h2{
  margin: 4px 0 8px;
  font-size: 26px;
  font-weight: 950;
}
.modal p{
  margin: 0 0 14px;
  color: var(--muted);
  line-height: 1.45;
  font-size: 14px;
}
.modal .modalBtn{
  width:100%;
  border:none;
  border-radius:999px;
  padding:14px 0;
  font-size:18px;
  font-weight:950;
  cursor:pointer;
  background: linear-gradient(90deg, rgba(255,127,200,.25), rgba(122,215,255,.25));
  border:1px solid rgba(0,0,0,.06);
}
.modal .modalBtn:active{transform:scale(.99)}

.toast{
  position:fixed;
  left:50%;
  bottom: 96px;
  transform:translateX(-50%);
  padding:10px 14px;
  border-radius:999px;
  background:#fff;
  border:1px solid rgba(0,0,0,.06);
  box-shadow: 0 16px 40px rgba(0,0,0,.18);
  font-weight:900;
  font-size:13px;
  opacity:0;
  transition: .18s ease;
  pointer-events:none;
  z-index:1000;
  max-width: calc(100vw - 28px);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

canvas#fx{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:998;
}

.resultBig{
  font-size:38px;
  font-weight:1000;
  margin: 10px 0 0;
}
.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:10px 12px;
  border-radius:999px;
  font-weight:950;
  margin-top:10px;
  border:1px solid rgba(0,0,0,.06);
  background: linear-gradient(90deg, rgba(255,127,200,.18), rgba(122,215,255,.18));
}

@media (max-width:360px){
  .q{font-size:18px}
  .btn{font-size:18px}
}
</style>
</head>

<body>
<canvas id="fx"></canvas>

<div class="app">
  <div class="top">
    <h1 class="title">🧠 Brain Quest</h1>
    <div class="subtitle">10 questions per stage · 5 stages · Yes/No only</div>
  </div>

  <div class="hud">
    <div class="left">
      <div class="chip" id="stageChip">Stage 1 / 5</div>
      <div class="chip" id="qChip">Q 1 / 10</div>
    </div>
    <div class="right">
      <div class="bar" aria-hidden="true"><div id="barFill"></div></div>
      <button class="miniBtn" id="soundBtn" type="button" aria-label="Toggle sound effects">🔊</button>
      <button class="miniBtn" id="musicBtn" type="button" aria-label="Toggle music">🎵</button>
      <button class="miniBtn" id="resetBtn" type="button">Reset</button>
    </div>
  </div>

  <div class="main">
    <div class="card" id="card">
      <div class="sticker" id="sticker">✨ Ready</div>
      <div class="q" id="qText">Tap Start to begin.</div>
      <div class="hint" id="hintText">
        Golden rule: if you're hesitant, if it's "sometimes", or if you're not 100% sure, answer No.
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="btnRow">
      <button class="btn yes" id="yesBtn" type="button"><span>YES 👍</span></button>
      <button class="btn no" id="noBtn" type="button"><span>NO 👎</span></button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">✨ Start the run?</h2>
    <p id="modalDesc">Tap Start to enable music and sound effects on mobile browsers.</p>
    <button class="modalBtn" id="modalBtn" type="button">Start!</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

const ASSESSMENT = {

<script>
/* =========================================
   Requirements implemented:
   - Mobile portrait first, sticky thumb-zone buttons
   - 5 randomized groups of 10; stage gate at each 10
   - Stage-specific music + stage-specific SFX timbre
   - Rewards: confetti + toasts + stage clear jingle
   - Results at end (total Yes)
   - Session storage only
   - No category labels shown
   ========================================= */

const TOTAL = ASSESSMENT.questions.length; // expected 50
const STAGES = 5;
const PER_STAGE = 10;
const STORAGE_KEY = "brain_quest_session_allinone_v1";

/* Stage skins + stage-only labels (no evaluation labels) */
const STAGE_SKINS = [
  {name:"Neon Bunnies",   sticker:"🐰✨", bg1:"#ffe6f3", bg2:"#e7f7ff", tempo:300},
  {name:"Candy Clouds",   sticker:"🍬☁️", bg1:"#fff1dc", bg2:"#e8f7ff", tempo:290},
  {name:"Star Sprinkles", sticker:"🌟🍩", bg1:"#f3e8ff", bg2:"#e8fff7", tempo:280},
  {name:"Bubble Boost",   sticker:"🫧🚀", bg1:"#e8fff7", bg2:"#ffe9f4", tempo:260},
  {name:"Final Plush",    sticker:"🧸👑", bg1:"#ffe9f4", bg2:"#e9f6ff", tempo:240}
];

/* ============ session state ============ */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function loadState(){
  try{
    const raw=sessionStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    const s=JSON.parse(raw);
    if(!s || !Array.isArray(s.groups) || typeof s.stage!=="number" || typeof s.inStage!=="number") return null;
    return s;
  }catch{return null;}
}
function saveState(s){ sessionStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
function clearState(){ sessionStorage.removeItem(STORAGE_KEY); }

function freshState(){
  const ids = ASSESSMENT.questions.map(q=>q.id);
  const order = shuffle(ids);
  const groups = [];
  for(let i=0;i<STAGES;i++){
    groups.push(order.slice(i*PER_STAGE, i*PER_STAGE + PER_STAGE));
  }
  return {
    groups,            // [[10 ids], ...] randomized into 5 groups
    stage: 0,          // 0..4
    inStage: 0,        // 0..9
    answers: {},       // id -> "Yes"|"No"
    yesCount: 0,
    started: false,
    musicOn: true,
    sfxOn: true
  };
}

let state = loadState();
if(!state || state.groups.flat().length !== TOTAL){
  state = freshState();
  saveState(state);
}

/* ============ UI refs ============ */
const els = {
  stageChip: document.getElementById("stageChip"),
  qChip: document.getElementById("qChip"),
  barFill: document.getElementById("barFill"),
  qText: document.getElementById("qText"),
  hintText: document.getElementById("hintText"),
  sticker: document.getElementById("sticker"),
  yesBtn: document.getElementById("yesBtn"),
  noBtn: document.getElementById("noBtn"),
  soundBtn: document.getElementById("soundBtn"),
  musicBtn: document.getElementById("musicBtn"),
  resetBtn: document.getElementById("resetBtn"),
  overlay: document.getElementById("overlay"),
  modalBtn: document.getElementById("modalBtn"),
  modalTitle: document.getElementById("modalTitle"),
  modalDesc: document.getElementById("modalDesc"),
  toast: document.getElementById("toast"),
  card: document.getElementById("card")
};

function qById(id){ return ASSESSMENT.questions.find(q => q.id === id); }
function clamp(n,min,max){ return Math.max(min, Math.min(max,n)); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

/* ============ toast ============ */
let toastT=null;
function toast(msg){
  els.toast.textContent=msg;
  els.toast.classList.add("show");
  clearTimeout(toastT);
  toastT=setTimeout(()=>els.toast.classList.remove("show"), 1100);
}

/* ============ FX canvas ============ */
const canvas = document.getElementById("fx");
const c2d = canvas.getContext("2d");
let parts=[];
let raf=null;

function resize(){
  canvas.width=Math.floor(innerWidth*devicePixelRatio);
  canvas.height=Math.floor(innerHeight*devicePixelRatio);
  canvas.style.width=innerWidth+"px";
  canvas.style.height=innerHeight+"px";
  c2d.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
addEventListener("resize", resize);
resize();

function popFX(intensity){
  const x=innerWidth/2+(Math.random()*80-40);
  const y=innerHeight*0.35+(Math.random()*60-30);
  for(let i=0;i<intensity;i++){
    parts.push({
      x,y,
      vx:(Math.random()*2-1)*6,
      vy:(Math.random()*-1.3-0.5)*7,
      g:0.25+Math.random()*0.12,
      s:2+Math.random()*4,
      a:1,
      h:Math.floor(Math.random()*360)
    });
  }
  if(!raf) loop();
}
function loop(){
  raf=requestAnimationFrame(loop);
  c2d.clearRect(0,0,innerWidth,innerHeight);
  for(const p of parts){
    p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.a-=0.014;
    c2d.globalAlpha=clamp(p.a,0,1);
    c2d.fillStyle=`hsl(${p.h},90%,70%)`;
    c2d.fillRect(p.x, p.y, p.s, p.s);
  }
  c2d.globalAlpha=1;
  parts=parts.filter(p=>p.a>0 && p.y<innerHeight+60);
  if(parts.length===0){
    cancelAnimationFrame(raf);
    raf=null;
  }
}

/* ============ Audio engine (stage music + stage SFX) ============ */
class AudioEngine{
  constructor(){
    this.ctx=null;
    this.master=null;
    this.musicGain=null;
    this.sfxGain=null;
    this.timer=null;
    this.step=0;
    this.stage=0;
    this.musicOn=true;
    this.sfxOn=true;
    this.patterns=[
      [261.63,329.63,392.00,523.25,392.00,329.63],
      [293.66,369.99,440.00,587.33,440.00,369.99],
      [220.00,277.18,329.63,440.00,329.63,277.18],
      [246.94,311.13,369.99,493.88,369.99,311.13],
      [196.00,246.94,293.66,392.00,493.88,392.00,293.66]
    ];
    this.stageSfx = [
      {wave:"sine",     yes:660, no:330},
      {wave:"triangle", yes:740, no:370},
      {wave:"square",   yes:620, no:310},
      {wave:"sawtooth", yes:700, no:350},
      {wave:"triangle", yes:820, no:410}
    ];
  }
  ensure(){
    if(!this.ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      this.ctx=new AC();
      this.master=this.ctx.createGain();
      this.master.gain.value=0.9;
      this.master.connect(this.ctx.destination);

      this.musicGain=this.ctx.createGain();
      this.musicGain.gain.value=0.22;
      this.musicGain.connect(this.master);

      this.sfxGain=this.ctx.createGain();
      this.sfxGain.gain.value=0.65;
      this.sfxGain.connect(this.master);
    }
    if(this.ctx.state==="suspended") this.ctx.resume();
  }
  setMusic(on){
    this.musicOn=on;
    if(!on) this.stopMusic();
    else this.startMusic(this.stage);
  }
  setSfx(on){
    this.sfxOn=on;
    if(this.sfxGain) this.sfxGain.gain.value = on ? 0.65 : 0;
  }
  stopMusic(){
    if(this.timer){ clearInterval(this.timer); this.timer=null; }
  }
  startMusic(stage){
    this.ensure();
    this.stage=stage;
    if(!this.musicOn) return;
    this.stopMusic();
    this.step=0;
    const tempo=STAGE_SKINS[stage]?.tempo ?? 280;
    const pat=this.patterns[stage] || this.patterns[0];
    this.timer=setInterval(()=>{
      if(!this.musicOn) return;
      const f=pat[this.step % pat.length];
      this._note(f, stage);
      if(stage>=2 && this.step%4===0) this._tick(90,0.03);
      this.step++;
    }, tempo);
  }
  _note(freq, stage){
    const now=this.ctx.currentTime;
    const osc=this.ctx.createOscillator();
    const gain=this.ctx.createGain();
    const filter=this.ctx.createBiquadFilter();

    osc.type = (stage%2===0) ? "triangle" : "square";
    filter.type="lowpass";
    filter.frequency.setValueAtTime(1200 + stage*220, now);

    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.18, now+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now+0.10);

    osc.connect(filter); filter.connect(gain); gain.connect(this.musicGain);
    osc.start(now); osc.stop(now+0.12);
  }
  _tick(freq,dur){
    const now=this.ctx.currentTime;
    const osc=this.ctx.createOscillator();
    const gain=this.ctx.createGain();
    osc.type="sine";
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.06, now+0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, now+dur);
    osc.connect(gain); gain.connect(this.musicGain);
    osc.start(now); osc.stop(now+dur+0.01);
  }
  sfx(kind, stage){
    if(!this.sfxOn) return;
    this.ensure();
    const cfg=this.stageSfx[stage] || this.stageSfx[0];
    const base = kind==="yes" ? cfg.yes : cfg.no;
    const now=this.ctx.currentTime;
    const osc=this.ctx.createOscillator();
    const gain=this.ctx.createGain();
    osc.type=cfg.wave;
    osc.frequency.setValueAtTime(base, now);
    osc.frequency.exponentialRampToValueAtTime(base*1.12, now+0.06);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.28, now+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now+0.14);
    osc.connect(gain); gain.connect(this.sfxGain);
    osc.start(now); osc.stop(now+0.16);
  }
  stageClear(){
    if(!this.sfxOn) return;
    this.ensure();
    const now=this.ctx.currentTime;
    const notes=[523.25,659.25,783.99];
    notes.forEach((f,i)=>{
      const osc=this.ctx.createOscillator();
      const gain=this.ctx.createGain();
      osc.type="triangle";
      osc.frequency.setValueAtTime(f, now+i*0.08);
      gain.gain.setValueAtTime(0.0001, now+i*0.08);
      gain.gain.exponentialRampToValueAtTime(0.30, now+i*0.08+0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now+i*0.08+0.12);
      osc.connect(gain); gain.connect(this.sfxGain);
      osc.start(now+i*0.08); osc.stop(now+i*0.08+0.14);
    });
  }
}
const audio = new AudioEngine();
audio.musicOn = !!state.musicOn;
audio.sfxOn = !!state.sfxOn;

/* ============ UI helpers ============ */
function applySkin(stageIdx){
  const s=STAGE_SKINS[stageIdx] || STAGE_SKINS[0];
  document.body.style.background = `linear-gradient(180deg, ${s.bg1}, ${s.bg2})`;
  els.sticker.textContent = `${s.sticker} ${s.name}`;
}
function showGate(title, desc, btnText){
  els.modalTitle.textContent=title;
  els.modalDesc.textContent=desc;
  els.modalBtn.textContent=btnText;
  els.overlay.classList.add("show");
}
function hideGate(){ els.overlay.classList.remove("show"); }

function render(){
  const stage=state.stage;          // 0..4
  const inStage=state.inStage + 1;  // 1..10

  applySkin(stage);
  els.stageChip.textContent=`Stage ${stage+1} / ${STAGES}`;
  els.qChip.textContent=`Q ${inStage} / ${PER_STAGE}`;
  els.barFill.style.width = `${(state.inStage/PER_STAGE)*100}%`;

  const qid = state.groups[stage][state.inStage];
  const q = qById(qid);
  els.qText.textContent = q ? q.text : "Loading...";
  els.hintText.textContent = "Golden rule: if you're hesitant, if it's \"sometimes\", or if you're not 100% sure, answer No.";

  els.soundBtn.textContent = state.sfxOn ? "🔊" : "🔇";
  els.musicBtn.textContent = state.musicOn ? "🎵" : "🚫🎵";
}

/* ============ scoring ============ */
function interpretation(yes){
  if(yes <= 10) return ASSESSMENT.scoring_guide.thresholds["0-10"];
  if(yes <= 20) return ASSESSMENT.scoring_guide.thresholds["11-20"];
  return ASSESSMENT.scoring_guide.thresholds["21+"];
}
function showResult(){
  audio.stopMusic();
  popFX(90);
  toast("Results unlocked!");
  const yes=state.yesCount;

  els.card.innerHTML = `
    <div class="sticker">${STAGE_SKINS[4].sticker} Finished</div>
    <div class="q">All done!</div>
    <div class="resultBig">${yes} / ${TOTAL}</div>
    <div class="badge">Total "Yes"</div>
    <div class="hint" style="margin-top:14px; font-size:14px; color:var(--muted);">
      ${escapeHtml(interpretation(yes))}
    </div>
    <div style="margin-top:16px; display:grid; gap:10px;">
      <button class="modalBtn" id="againBtn" type="button">Play again</button>
      <button class="modalBtn" id="reviewBtn" type="button">Review answers</button>
    </div>
    <div id="reviewBox" style="display:none; margin-top:16px; text-align:left;"></div>
  `;

  const againBtn=document.getElementById("againBtn");
  const reviewBtn=document.getElementById("reviewBtn");
  const reviewBox=document.getElementById("reviewBox");

  againBtn.onclick=()=>{ clearState(); location.reload(); };
  reviewBtn.onclick=()=>{
    const open = reviewBox.style.display !== "none";
    reviewBox.style.display = open ? "none" : "block";
    reviewBtn.textContent = open ? "Review answers" : "Hide review";
    if(!open){
      const flat = state.groups.flat();
      const lines = flat.map((id, i)=>{
        const q=qById(id);
        const a=state.answers[id] || "—";
        const color = a==="Yes" ? "#13a76a" : (a==="No" ? "#d74b6a" : "#888");
        return `<div style="padding:10px 10px; border-radius:16px; background:rgba(0,0,0,.04); margin-bottom:10px;">
          <div style="font-weight:900; color:${color};">${i+1}. ${a}</div>
          <div style="margin-top:6px; line-height:1.35;">${escapeHtml(q?.text || "")}</div>
        </div>`;
      }).join("");
      reviewBox.innerHTML = lines;
    }
  };

  els.yesBtn.disabled=true; els.noBtn.disabled=true;
  els.yesBtn.style.opacity=0.55; els.noBtn.style.opacity=0.55;
}

/* ============ answer flow (10 per stage gate) ============ */
function answer(ans){
  // Always re-enable audio on any user interaction (iOS can suspend in background)
  audio.ensure();

  // First interaction: start music; first tap still counts as an answer
  if(!state.started){
    state.started = true;
    saveState(state);
    if(state.musicOn) audio.startMusic(state.stage);
    hideGate();
    toast("Audio enabled!");
  }

  const stage=state.stage;
  const qid = state.groups[stage][state.inStage];
  const prev = state.answers[qid];

  if(prev === "Yes") state.yesCount -= 1;
  if(ans === "Yes") state.yesCount += 1;
  state.answers[qid] = ans;

  audio.sfx(ans === "Yes" ? "yes" : "no", stage);
  popFX(ans === "Yes" ? 14 : 10);
  toast(ans === "Yes" ? "Nice!" : "Strict mode!");

  state.inStage += 1;

  // Stage clear
  if(state.inStage >= PER_STAGE){
    state.inStage = 0;
    state.stage += 1;
    saveState(state);

    if(state.stage >= STAGES){
      showResult();
      return;
    }

    audio.stageClear();
    popFX(70);

    if(state.musicOn) audio.startMusic(state.stage);

    showGate(`✨ Stage ${state.stage} cleared!`, `Ready for Stage ${state.stage+1}?`, "Go!");
    return;
  }

  saveState(state);
  render();
}

/* ============ buttons ============ */
els.yesBtn.addEventListener("click", ()=>answer("Yes"));
els.noBtn.addEventListener("click", ()=>answer("No"));

els.soundBtn.addEventListener("click", ()=>{
  audio.ensure();
  state.sfxOn = !state.sfxOn;
  audio.setSfx(state.sfxOn);
  saveState(state);
  els.soundBtn.textContent = state.sfxOn ? "🔊" : "🔇";
  toast(state.sfxOn ? "SFX on" : "SFX off");
});

els.musicBtn.addEventListener("click", ()=>{
  audio.ensure();
  state.musicOn = !state.musicOn;
  audio.setMusic(state.musicOn);
  saveState(state);
  els.musicBtn.textContent = state.musicOn ? "🎵" : "🚫🎵";
  toast(state.musicOn ? "Music on" : "Music off");
});

els.resetBtn.addEventListener("click", ()=>{
  clearState();
  toast("Session cleared");
  location.reload();
});

document.getElementById("modalBtn").addEventListener("click", ()=>{
  audio.ensure();
  if(!state.started){
    state.started=true;
    saveState(state);
    if(state.musicOn) audio.startMusic(state.stage);
    toast("Let’s go!");
  }
  hideGate();
  render();
});

/* ============ boot ============ */
render();
if(state.stage >= STAGES){
  showResult();
} else {
  showGate(
    state.started ? "✨ Resume?" : "✨ Start the run?",
    state.started
      ? "Tap Continue to re-enable audio on mobile and keep going."
      : "Tap Start to enable music and sound effects.",
    state.started ? "Continue" : "Start!"
  );
}
</script>
</body>
</html>
